[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-saliency-heatmapper"
version = "0.1.0"
description = "Attention score heatmapper and 'Lost in the Middle' position optimizer that positions crucial context at prompt extremes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
context-saliency-heatmapper = "context_saliency_heatmapper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_saliency_heatmapper*"]
